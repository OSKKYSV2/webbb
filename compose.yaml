services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Nastavte MSSQL_SA_PASSWORD v .env (nikdy necommitovat)}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/opt/mssql/data/master.mdf"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  sqlserver_data:
